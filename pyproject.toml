[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hostlib"
dynamic = ["version"]
description = "Run a program, stream its output, and keep the record: what a Python program stands on to run other programs"
readme = "README.rst"
license = { text = "MIT" }
authors = [{ name = "FNNDSC", email = "dev@babyMRI.org" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
]

[project.urls]
Homepage = "https://github.com/FNNDSC/hostlib"

[project.scripts]
hostlib = "hostlib.cli.commands:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["hostlib*"]

[tool.setuptools.dynamic]
version = { attr = "hostlib.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
